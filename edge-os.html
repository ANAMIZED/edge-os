<!DOCTYPE html>

<head>

<style>
/* EDGE OS — night desk / amber phosphor. Offline-only: system fonts. */
:root{
  --ink:#0B0E14; --deep:#080B10; --panel:#121826; --panel2:#0E1420;
  --line:#22304A; --line2:#182338;
  --amber:#FFB01F; --amber-soft:#FFCE6B; --amber-deep:#8A6210;
  --up:#2DD4A7; --down:#FF5C6C; --violet:#9D8CFF; --violet-deep:#3A3170;
  --text:#E9EEF7; --muted:#8B96AB; --faint:#5A6478;
  --mono:ui-monospace,'SF Mono','Cascadia Mono','JetBrains Mono','Roboto Mono',Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --rail-h:52px; --dock-h:64px; --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--text);
  font:15px/1.5 var(--mono);font-variant-numeric:tabular-nums;
  overscroll-behavior:none;touch-action:manipulation;
  -webkit-font-smoothing:antialiased;
}
body::after{ /* faint scanlines — the one texture, kept whisper-quiet */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:99;opacity:.05;
  background:repeating-linear-gradient(0deg,transparent 0 2px,#000 2px 3px);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
::selection{background:var(--amber-deep);color:#fff}
a{color:var(--amber-soft)}

/* ---------- boot POST ---------- */
#boot{position:fixed;inset:0;z-index:200;background:var(--deep);
  display:flex;align-items:center;justify-content:center;transition:opacity .45s}
#boot.done{opacity:0;pointer-events:none}
#boot .post{width:min(560px,88vw);font-size:13px;line-height:1.9;color:var(--muted)}
#boot .post .brand{color:var(--amber);font-size:22px;letter-spacing:.28em;margin-bottom:14px;
  text-shadow:0 0 18px rgba(255,176,31,.45)}
#boot .post .ok{color:var(--up)} #boot .post .warn{color:var(--amber)}
#boot .skip{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:0;right:0;
  text-align:center;color:var(--faint);font-size:12px;letter-spacing:.12em}

/* ---------- OS frame ---------- */
#os{display:flex;flex-direction:column;height:100dvh}
/* risk rail — the signature */
#rail{
  height:calc(var(--rail-h) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 12px 0 12px;
  display:flex;align-items:center;gap:10px;flex-shrink:0;
  background:linear-gradient(180deg,#101624,#0C111C);
  border-bottom:1px solid var(--line2);position:relative;z-index:5;
}
#rail .brand{font-size:13px;letter-spacing:.24em;color:var(--amber);white-space:nowrap;
  text-shadow:0 0 14px rgba(255,176,31,.35)}
#rail .brand small{color:var(--faint);letter-spacing:.1em;margin-left:6px;font-size:10px}
.lamp{display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.14em;
  color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 9px;white-space:nowrap}
.lamp i{width:7px;height:7px;border-radius:50%;background:var(--faint);box-shadow:none;flex:none}
.lamp.on i{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.lamp.kill i{background:var(--down);box-shadow:0 0 8px var(--down)}
.lamp.up i{background:var(--up);box-shadow:0 0 8px var(--up)}
#rail .gov{margin-left:auto;display:flex;align-items:center;gap:8px}
.govbar{position:relative;width:74px;height:16px;border:1px solid var(--amber-deep);border-radius:4px;
  overflow:hidden;flex:none}
.govbar span{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,rgba(255,176,31,.15),rgba(255,176,31,.55))}
.govbar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:9px;letter-spacing:.14em;color:var(--amber-soft);font-weight:600}
#killBtn{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:10px;
  letter-spacing:.14em;color:var(--muted)}
#killBtn.killed{border-color:var(--down);color:var(--down);background:rgba(255,92,108,.08)}

/* ---------- viewport ---------- */
#view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 14px calc(var(--dock-h) + 26px + env(safe-area-inset-bottom));}
.wrap{max-width:860px;margin:0 auto}
.eyebrow{font-size:10px;letter-spacing:.26em;color:var(--faint);text-transform:uppercase;margin:0 0 4px}
h1.app{font-size:24px;margin:0 0 4px;letter-spacing:.02em;font-weight:600}
p.lede{margin:0 0 18px;color:var(--muted);font-family:var(--sans);font-size:13.5px;max-width:56ch}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);
  padding:14px;margin:0 0 12px}
.card h3{margin:0 0 10px;font-size:11px;letter-spacing:.2em;color:var(--muted);font-weight:600;
  text-transform:uppercase;display:flex;align-items:center;gap:8px}
.card h3 .tag{margin-left:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--line2);font-size:13px}
.kv:last-child{border-bottom:0}
.kv b{color:var(--text);font-weight:500}.kv span{color:var(--muted)}
.big{font-size:30px;color:var(--amber);letter-spacing:.01em;text-shadow:0 0 22px rgba(255,176,31,.28)}
.tag{font-size:9px;letter-spacing:.16em;border:1px solid var(--line);color:var(--muted);
  border-radius:4px;padding:2px 6px;text-transform:uppercase;white-space:nowrap}
.tag.gold{border-color:var(--amber-deep);color:var(--amber-soft)}
.tag.green{border-color:rgba(45,212,167,.5);color:var(--up)}
.tag.red{border-color:rgba(255,92,108,.5);color:var(--down)}
.tag.violet{border-color:var(--violet-deep);color:var(--violet)}

/* buttons */
.btn{border:1px solid var(--amber-deep);color:var(--amber-soft);border-radius:8px;
  padding:11px 16px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  background:rgba(255,176,31,.06);min-height:44px}
.btn:active{background:rgba(255,176,31,.16)}
.btn.ghost{border-color:var(--line);color:var(--muted);background:transparent}
.btn.violet{border-color:var(--violet-deep);color:var(--violet);background:rgba(157,140,255,.06)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 14px;align-items:center}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;
  color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:9px 13px;min-height:44px}
.switch i{width:26px;height:14px;border-radius:999px;background:var(--line);position:relative;transition:.15s;flex:none}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;
  background:var(--muted);transition:.15s}
.switch.on{border-color:var(--amber-deep);color:var(--amber-soft)}
.switch.on i{background:var(--amber-deep)}
.switch.on i::after{left:14px;background:var(--amber)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:9px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase;text-align:left;
  padding:0 8px 7px 0;border-bottom:1px solid var(--line2);font-weight:600}
td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;padding-right:0}
.pos{color:var(--up)}.neg{color:var(--down)}.gold{color:var(--amber-soft)}
.tick-up{animation:tickU .8s}.tick-down{animation:tickD .8s}
@keyframes tickU{0%{background:rgba(45,212,167,.22)}100%{background:transparent}}
@keyframes tickD{0%{background:rgba(255,92,108,.22)}100%{background:transparent}}

/* opportunity card */
.opp{border:1px solid var(--amber-deep);background:linear-gradient(180deg,rgba(255,176,31,.05),transparent)}
.legs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:10px 0}
.leg{border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px}
.leg .side{font-size:9px;letter-spacing:.2em}
.leg.long .side{color:var(--up)}.leg.short .side{color:var(--down)}
.leg .venue{font-size:15px;margin:3px 0 2px;text-transform:capitalize}
.leg .apr{color:var(--muted);font-size:11px}
.vs{color:var(--faint);font-size:11px;letter-spacing:.2em}
.waterfall{display:flex;height:14px;border-radius:4px;overflow:hidden;border:1px solid var(--line);margin:8px 0 4px}
.waterfall i{display:block;height:100%}
.wf-net{background:linear-gradient(90deg,#C98A12,var(--amber))}
.wf-slip{background:rgba(255,92,108,.4)}
.wf-cost{background:rgba(255,92,108,.7)}
.wflegend{display:flex;gap:14px;font-size:10px;color:var(--muted);letter-spacing:.08em}
.wflegend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* decision log / workflow timeline */
.log{font-size:12px;line-height:1.7;max-height:300px;overflow:auto}
.log .row{padding:7px 0;border-bottom:1px dashed var(--line2);display:flex;gap:10px}
.log .row:last-child{border-bottom:0}
.log .who{color:var(--amber-soft);flex:none;min-width:104px;font-size:11px;letter-spacing:.06em}
.log .who.v{color:var(--violet)}
.log .what{color:var(--muted)} .log .what b{color:var(--text);font-weight:500}
.flowstep{opacity:0;transform:translateY(4px);animation:stepIn .35s forwards}
@keyframes stepIn{to{opacity:1;transform:none}}

/* terminal */
#termOut{background:var(--deep);border:1px solid var(--line2);border-radius:var(--r);
  padding:12px;height:min(52vh,440px);overflow-y:auto;font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
#termOut .in{color:var(--amber-soft)} #termOut .err{color:var(--down)}
.termbar{display:flex;gap:8px;margin-top:10px}
#termIn{flex:1;background:var(--deep);border:1px solid var(--line);border-radius:8px;
  padding:12px;font-size:16px;color:var(--text);min-height:44px;outline:none}
#termIn:focus{border-color:var(--amber-deep)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;-webkit-overflow-scrolling:touch}
.chips button{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:11px;
  color:var(--muted);white-space:nowrap;flex:none;min-height:36px}

/* verify */
.vgroup{margin:0 0 10px}
.vgroup h4{margin:12px 0 6px;font-size:10px;letter-spacing:.22em;color:var(--faint);text-transform:uppercase}
.vrow{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line2);font-size:12.5px}
.vrow:last-child{border-bottom:0}
.vrow .mark{flex:none;width:18px;text-align:center}
.vrow.pass .mark{color:var(--up)} .vrow.fail .mark{color:var(--down)}
.vrow .nm{color:var(--muted)} .vrow.fail .nm{color:var(--down)}
#vsummary{display:flex;align-items:center;gap:12px;margin-bottom:6px}
#vbadge{font-size:26px;letter-spacing:.06em}
#vbadge.pass{color:var(--up);text-shadow:0 0 20px rgba(45,212,167,.4)}
#vbadge.fail{color:var(--down)}
.meter{flex:1;height:8px;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--amber-deep),var(--up));width:0;transition:width .2s}

/* docs */
.tabs{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.tabs button{border:1px solid var(--line);border-radius:8px;padding:9px 13px;font-size:11px;
  letter-spacing:.1em;color:var(--muted);white-space:nowrap;flex:none;min-height:40px}
.tabs button.act{border-color:var(--amber-deep);color:var(--amber-soft);background:rgba(255,176,31,.06)}
.doc{font-family:var(--sans);font-size:14px;line-height:1.65;color:#C7D0E0}
.doc h2{font-family:var(--mono);font-size:16px;color:var(--text);margin:18px 0 8px;letter-spacing:.02em}
.doc h2:first-child{margin-top:0}
.doc h3{font-family:var(--mono);font-size:12px;color:var(--amber-soft);letter-spacing:.14em;
  text-transform:uppercase;margin:16px 0 6px}
.doc p{margin:0 0 10px}.doc ul,.doc ol{margin:0 0 10px;padding-left:20px}.doc li{margin:3px 0}
.doc code,.doc pre{font-family:var(--mono);font-size:12px;background:var(--deep);
  border:1px solid var(--line2);border-radius:6px}
.doc code{padding:1px 5px}
.doc pre{padding:12px;overflow-x:auto;line-height:1.6}
.doc pre code{border:0;background:none;padding:0}
.doc table{font-family:var(--mono);margin:0 0 12px}
.prov{border:1px dashed var(--amber-deep);border-radius:8px;padding:10px 12px;font-size:12px;
  color:var(--amber-soft);background:rgba(255,176,31,.04);margin:0 0 14px;font-family:var(--mono)}
.prov.re{border-color:var(--violet-deep);color:var(--violet);background:rgba(157,140,255,.05)}

/* sealed lab */
.sealed{border:1px solid var(--violet-deep);background:linear-gradient(180deg,rgba(157,140,255,.05),transparent)}
.splitbar{display:flex;height:12px;border-radius:4px;overflow:hidden;border:1px solid var(--violet-deep);margin:8px 0 4px}
.splitbar .tr{background:rgba(157,140,255,.45)} .splitbar .ho{background:rgba(157,140,255,.15)}
.belief{border:1px solid var(--violet-deep);border-radius:8px;padding:10px;margin:8px 0;font-size:12px}
.belief .id{color:var(--violet);letter-spacing:.1em;font-size:10px}

/* charts */
canvas.spark{width:100%;height:76px;display:block}

/* dock */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:10;
  background:rgba(10,13,20,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line2);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
#dock nav{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scroll-snap-type:x proximity;max-width:860px;margin:0 auto}
#dock nav::-webkit-scrollbar{display:none}
#dock button{flex:1 0 62px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;border-radius:10px;color:var(--faint);min-height:48px}
#dock button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
#dock button span{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase}
#dock button.act{color:var(--amber);background:rgba(255,176,31,.08)}
#dock button.act svg{filter:drop-shadow(0 0 6px rgba(255,176,31,.6))}
#dock button.lab.act{color:var(--violet);background:rgba(157,140,255,.08)}

.footnote{color:var(--faint);font-size:11px;font-family:var(--sans);margin-top:18px;line-height:1.6}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px}
@media(max-width:479px){
  #modeLamp{display:none}
  #rail .brand{font-size:12px;letter-spacing:.18em}
  .govbar{width:60px}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  body::after{display:none}
}
@media(min-width:720px){
  #view{padding-left:24px;padding-right:24px}
  #dock button{flex:0 0 84px}
  #dock nav{justify-content:center}
}

</style>

<script>
/* ============================================================================
   EDGE OS — kernel (JavaScript port, v0.1.0)
   Autonomous Agentic Operating System for RWA Perpetual Futures Arbitrage
   Ported from github.com/ANAMIZED/edge-os (Apache-2.0). Offline / mock only.
   Fail-closed by construction: every gate rejects unless explicitly satisfied.
   ========================================================================== */
'use strict';

/* ------------------------------- enums ---------------------------------- */
const Venue = Object.freeze({
  LIGHTER: 'lighter', HYPERLIQUID: 'hyperliquid', BINANCE: 'binance',
  OSTIUM: 'ostium', BYBIT: 'bybit', OKX: 'okx',
});
const VENUE_LIST = Object.freeze(Object.values(Venue));

const AssetClass = Object.freeze({
  COMMODITY: 'commodity', FX: 'fx', INDEX: 'index', CRYPTO: 'crypto',
});

/* Weekend-exposed asset classes: underlying RWA markets close, oracles can
   go stale while perps keep trading -> weekend gap risk (research-aligned). */
const WEEKEND_EXPOSED = Object.freeze([AssetClass.COMMODITY, AssetClass.FX, AssetClass.INDEX]);

/* Research-preferred venue pairings (AGENTS.md rule 4): Lighter + HL/Binance. */
const PREFERRED_PAIRS = Object.freeze([
  [Venue.LIGHTER, Venue.HYPERLIQUID],
  [Venue.LIGHTER, Venue.BINANCE],
]);

/* ---------------------------- tiny validators --------------------------- */
function req(cond, msg) { if (!cond) throw new Error('ValidationError: ' + msg); }
function isNum(x) { return typeof x === 'number' && Number.isFinite(x); }
function clamp(x, lo, hi) { return Math.min(hi, Math.max(lo, x)); }
function round1(x) { return Math.round(x * 10) / 10; }

/* Deterministic PRNG (mulberry32) — the mock path must stay deterministic. */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* -------------------------------- models -------------------------------- */
/* Field names mirror src/edge_os/models.py as exercised by cli.py verbatim. */

function NormalizedMarket(f) {
  req(f && typeof f === 'object', 'NormalizedMarket requires fields');
  req(VENUE_LIST.includes(f.venue), 'venue must be a known Venue');
  req(typeof f.symbol === 'string' && f.symbol.length > 0, 'symbol required');
  req(typeof f.base_asset === 'string' && f.base_asset.length > 0, 'base_asset required');
  req(Object.values(AssetClass).includes(f.asset_class), 'asset_class must be a known AssetClass');
  req(isNum(f.mark_price) && f.mark_price > 0, 'mark_price must be > 0');
  req(isNum(f.funding_rate), 'funding_rate must be a number');
  req(isNum(f.funding_interval_hours) && f.funding_interval_hours > 0, 'funding_interval_hours must be > 0');
  req(isNum(f.funding_apr), 'funding_apr must be a number');
  req(isNum(f.open_interest) && f.open_interest >= 0, 'open_interest must be >= 0');
  req(isNum(f.max_leverage) && f.max_leverage > 0, 'max_leverage must be > 0');
  return Object.freeze({
    venue: f.venue, symbol: f.symbol, base_asset: f.base_asset, asset_class: f.asset_class,
    mark_price: f.mark_price, funding_rate: f.funding_rate,
    funding_interval_hours: f.funding_interval_hours, funding_apr: f.funding_apr,
    open_interest: f.open_interest, max_leverage: f.max_leverage,
    oracle_fresh: f.oracle_fresh !== false, // oracle gate input; defaults fresh
  });
}

function FundingOpportunity(f) {
  const need = ['asset', 'long_venue', 'short_venue', 'long_funding_apr', 'short_funding_apr',
    'gross_spread_apr', 'estimated_net_apr', 'long_oi', 'short_oi',
    'liquidity_score', 'risk_score', 'recommended_leverage'];
  for (const k of need) req(f && f[k] !== undefined, 'FundingOpportunity missing ' + k);
  req(VENUE_LIST.includes(f.long_venue) && VENUE_LIST.includes(f.short_venue), 'venues must be known');
  req(f.long_venue !== f.short_venue, 'long and short venue must differ');
  return Object.freeze({ ...f,
    preferred_pairing: isPreferredPair(f.long_venue, f.short_venue),
  });
}

function isPreferredPair(a, b) {
  return PREFERRED_PAIRS.some(([x, y]) => (a === x && b === y) || (a === y && b === x));
}

/* Research-aligned risk limits (AGENTS.md hard rules). HARD caps are frozen:
   even reconfiguration cannot exceed them — the guardian fails closed. */
const HARD = Object.freeze({
  LEVERAGE_MAX: 5.0,        // "leverage 2-5x max"
  LEVERAGE_MIN: 2.0,
  MIN_NOTIONAL: 1000,       // dust guard: below this, reject rather than fill
});

function RiskLimits(overrides) {
  const d = {
    max_leverage: 5.0,
    min_leverage: 2.0,
    max_position_notional: 100000,   // per delta-neutral pair, USD
    max_total_notional: 250000,
    max_venue_exposure: 150000,
    min_net_apr: 0.05,               // 5% net APR floor
    min_liquidity_score: 0.5,
    max_risk_score: 0.6,
    max_drawdown_pct: 0.10,          // kill at -10%
    weekend_size_multiplier: 0.5,    // weekend gap buffer for RWA legs
    dual_leg_margin_buffer: 1.25,    // +25% margin buffer on BOTH legs
    max_oi_fraction: 0.01,           // <=1% of the thinner leg's OI
    require_fresh_oracle: true,      // oracle gate
  };
  const L = { ...d, ...(overrides || {}) };
  // Fail closed: clamp any attempt to loosen the hard caps.
  L.max_leverage = clamp(L.max_leverage, HARD.LEVERAGE_MIN, HARD.LEVERAGE_MAX);
  L.min_leverage = clamp(L.min_leverage, HARD.LEVERAGE_MIN, L.max_leverage);
  return Object.freeze(L);
}

function PortfolioState(f) {
  const p = {
    capital: 50000, total_notional: 0, drawdown_pct: 0,
    kill_switch: false, venue_notional: {}, open_positions: [],
    ...(f || {}),
  };
  req(isNum(p.capital) && p.capital > 0, 'capital must be > 0');
  return p; // mutable by design: the kernel owns portfolio state
}

/* --------------------------- funding detector --------------------------- */
/* FundingScanner/FundingSpreadDetector: group markets by base asset, pair
   venues, long the low-funding leg, short the high-funding leg. */

const DETECTOR_DEFAULTS = Object.freeze({
  min_gross_spread_apr: 0.05,  // ignore noise below 5% APR gross
  slippage_haircut: 0.10,      // 10% of gross lost to entry/exit slippage
  fixed_cost_apr: 0.02,        // fees + borrow drag, annualized
});

class FundingSpreadDetector {
  constructor(cfg) { this.cfg = { ...DETECTOR_DEFAULTS, ...(cfg || {}) }; }

  detect(markets) {
    req(Array.isArray(markets), 'detect(markets) requires an array');
    const byAsset = new Map();
    for (const m of markets.map(NormalizedMarket)) {
      if (!byAsset.has(m.base_asset)) byAsset.set(m.base_asset, []);
      byAsset.get(m.base_asset).push(m);
    }
    const opps = [];
    for (const [asset, ms] of byAsset) {
      for (let i = 0; i < ms.length; i++) for (let j = i + 1; j < ms.length; j++) {
        const a = ms[i], b = ms[j];
        if (a.venue === b.venue) continue;
        const long = a.funding_apr <= b.funding_apr ? a : b;   // pay less
        const short = a.funding_apr <= b.funding_apr ? b : a;  // receive more
        const gross = short.funding_apr - long.funding_apr;
        if (gross < this.cfg.min_gross_spread_apr) continue;
        if (long.open_interest <= 0 || short.open_interest <= 0) continue;
        const net = gross * (1 - this.cfg.slippage_haircut) - this.cfg.fixed_cost_apr;
        if (net <= 0) continue;
        const minOi = Math.min(long.open_interest, short.open_interest);
        const liquidity = clamp(Math.log10(Math.max(minOi, 1)) / 8, 0, 1);
        const weekendExposed = WEEKEND_EXPOSED.includes(long.asset_class);
        const risk = clamp(0.15 + (weekendExposed ? 0.15 : 0) + (gross > 0.8 ? 0.10 : 0), 0, 1);
        const recLev = round1(clamp(2 + 3 * liquidity * (1 - risk), HARD.LEVERAGE_MIN, HARD.LEVERAGE_MAX));
        opps.push(FundingOpportunity({
          asset, long_venue: long.venue, short_venue: short.venue,
          long_funding_apr: long.funding_apr, short_funding_apr: short.funding_apr,
          gross_spread_apr: gross, estimated_net_apr: net,
          long_oi: long.open_interest, short_oi: short.open_interest,
          liquidity_score: Math.round(liquidity * 1000) / 1000,
          risk_score: Math.round(risk * 1000) / 1000,
          recommended_leverage: recLev,
          long_symbol: long.symbol, short_symbol: short.symbol,
          long_mark: long.mark_price, short_mark: short.mark_price,
          weekend_exposed: weekendExposed,
          oracle_fresh: long.oracle_fresh && short.oracle_fresh,
        }));
      }
    }
    // Rank: research-preferred pairings first, then by net APR.
    opps.sort((x, y) => (Number(y.preferred_pairing) - Number(x.preferred_pairing)) ||
                        (y.estimated_net_apr - x.estimated_net_apr));
    return opps;
  }
}
const FundingScanner = FundingSpreadDetector; // alias kept per AGENTS.md surfaces

/* ------------------------------ risk guardian --------------------------- */
class RiskGuardian {
  constructor(limits) { this.limits = limits || RiskLimits(); this.decisions = []; }

  /* Returns { approved: ApprovedTrade|null, reasons: string[] }.
     Any failed gate rejects — never "partially approve" past a hard gate. */
  evaluate(opp, portfolio, ctx) {
    const L = this.limits;
    const P = portfolio || PortfolioState();
    const C = { weekend: false, ...(ctx || {}) };
    const reasons = [];
    const gate = (ok, code) => { if (!ok) reasons.push(code); return ok; };

    gate(!P.kill_switch, 'KILL_SWITCH_ENGAGED');
    gate(P.drawdown_pct < L.max_drawdown_pct, 'MAX_DRAWDOWN_BREACHED');
    if (L.require_fresh_oracle) gate(opp.oracle_fresh !== false, 'ORACLE_STALE');
    gate(opp.estimated_net_apr >= L.min_net_apr, 'NET_APR_BELOW_FLOOR');
    gate(opp.liquidity_score >= L.min_liquidity_score, 'LIQUIDITY_BELOW_FLOOR');
    gate(opp.risk_score <= L.max_risk_score, 'RISK_SCORE_ABOVE_CEILING');

    let approved = null;
    if (reasons.length === 0) {
      const lev = clamp(opp.recommended_leverage, L.min_leverage, L.max_leverage);
      let notional = Math.min(L.max_position_notional, P.capital * lev);
      notional = Math.min(notional, L.max_oi_fraction * Math.min(opp.long_oi, opp.short_oi));
      notional = Math.min(notional, Math.max(0, L.max_total_notional - P.total_notional));
      const venueRoom = (v) => Math.max(0, L.max_venue_exposure - (P.venue_notional[v] || 0));
      notional = Math.min(notional, venueRoom(opp.long_venue), venueRoom(opp.short_venue));
      // Dual-leg margin with buffer must fit in capital; scale down, else reject.
      const marginPerNotional = (2 / lev) * L.dual_leg_margin_buffer;
      const maxByMargin = P.capital / marginPerNotional;
      notional = Math.min(notional, maxByMargin);
      // Weekend gap buffer applies LAST so it always halves the final size.
      if (C.weekend) notional *= L.weekend_size_multiplier;
      notional = Math.floor(notional);
      if (gate(notional >= HARD.MIN_NOTIONAL, 'NOTIONAL_BELOW_MINIMUM')) {
        approved = Object.freeze({
          asset: opp.asset, long_venue: opp.long_venue, short_venue: opp.short_venue,
          approved_notional: notional, approved_leverage: lev,
          required_margin: Math.ceil(notional * marginPerNotional),
          expected_net_apr: opp.estimated_net_apr,
          weekend_buffer_applied: !!C.weekend, mode: 'DRY_RUN',
        });
      }

    }
    const record = Object.freeze({
      t: Date.now(), asset: opp.asset, pair: opp.long_venue + '/' + opp.short_venue,
      approved: !!approved, reasons: reasons.slice(),
      notional: approved ? approved.approved_notional : 0,
      leverage: approved ? approved.approved_leverage : 0,
    });
    this.decisions.push(record);
    return { approved, reasons, record };
  }
}

/* ----------------------------- dry-run executor -------------------------- */
class DryRunExecutor {
  constructor() { this.fills = []; }
  execute(trade, marks) {
    req(trade && trade.mode === 'DRY_RUN', 'executor only accepts DRY_RUN approved trades');
    const mk = marks || {};
    const px = (v) => (isNum(mk[v]) ? mk[v] : 100);
    const SLIP = 0.0005; // 5 bps simulated slippage, adverse on both legs
    const legs = [
      { venue: trade.long_venue, side: 'long', notional: trade.approved_notional,
        price: px(trade.long_venue) * (1 + SLIP), qty: trade.approved_notional / px(trade.long_venue) },
      { venue: trade.short_venue, side: 'short', notional: trade.approved_notional,
        price: px(trade.short_venue) * (1 - SLIP), qty: trade.approved_notional / px(trade.short_venue) },
    ];
    const report = Object.freeze({
      status: 'FILLED_DRY_RUN', asset: trade.asset, legs,
      approved_leverage: trade.approved_leverage,
      required_margin: trade.required_margin,
      est_daily_funding_usd: Math.round(trade.approved_notional * trade.expected_net_apr / 365 * 100) / 100,
      t: Date.now(),
    });
    this.fills.push(report);
    return report;
  }
}

/* ------------------------ research: sealed sandbox ----------------------- */
/* AQuA-inspired asymmetry (AGENTS.md rule 7): research agents run against
   FIXED, seeded data splits and a sealed evaluator. They may write validated
   beliefs to BeliefStore but hold NO authority over capital, limits, or
   execution. The live path reads beliefs only via consult_beliefs=true. */

class BeliefStore {
  constructor() { this._beliefs = []; this.sealed = true; }
  add(b) {
    const belief = Object.freeze({
      id: 'blf_' + (this._beliefs.length + 1).toString().padStart(3, '0'),
      hypothesis: String(b.hypothesis), param: b.param, value: b.value,
      train_score: b.train_score, holdout_score: b.holdout_score,
      confidence: b.confidence, validated: !!b.validated, t: b.t || 0,
    });
    this._beliefs.push(belief);
    return belief;
  }
  list() { return this._beliefs.slice(); }
  validated() { return this._beliefs.filter((b) => b.validated); }
}

class SealedEvaluator {
  constructor(seed) {
    this.seed = seed === undefined ? 42 : seed;
    const rnd = mulberry32(this.seed);
    // Fixed synthetic gross-spread APR series: mean-reverting around 0.30.
    const series = []; let x = 0.30;
    for (let i = 0; i < 240; i++) {
      x = clamp(x + 0.9 * (0.30 - x) * 0.1 + (rnd() - 0.5) * 0.12, 0, 1.6);
      series.push(x);
    }
    this.splits = Object.freeze({ train: series.slice(0, 160), holdout: series.slice(160) });
  }
  /* Score an entry-threshold hypothesis: capture (spread - costs) while in. */
  score(thresholdApr, split) {
    const s = this.splits[split]; req(s, 'unknown split ' + split);
    const COST = 0.05; let pnl = 0, n = 0;
    for (const spread of s) if (spread >= thresholdApr) { pnl += spread - COST; n++; }
    if (n === 0) return 0;
    return Math.round((pnl / s.length) * 1000) / 1000; // avg captured APR per bar
  }
}

class ResearchLoop {
  constructor(store, evaluator) {
    this.store = store || new BeliefStore();
    this.evaluator = evaluator || new SealedEvaluator(42);
  }
  run(iterations) {
    const iters = iterations || 8;
    const candidates = [];
    for (let i = 0; i < iters; i++) candidates.push(0.05 + i * (0.45 / Math.max(1, iters - 1)));
    const baseline = this.evaluator.score(DETECTOR_DEFAULTS.min_gross_spread_apr, 'holdout');
    const log = []; let best = null;
    for (const c of candidates) {
      const tr = this.evaluator.score(c, 'train');
      const ho = this.evaluator.score(c, 'holdout');
      log.push({ candidate: Math.round(c * 1000) / 1000, train: tr, holdout: ho });
      if (!best || tr > best.train) best = { candidate: c, train: tr, holdout: ho };
    }
    let belief = null;
    if (best && best.holdout >= baseline) {
      belief = this.store.add({
        hypothesis: 'Entry threshold ' + best.candidate.toFixed(3) +
          ' APR captures more spread than default on sealed holdout',
        param: 'min_gross_spread_apr', value: Math.round(best.candidate * 1000) / 1000,
        train_score: best.train, holdout_score: best.holdout,
        confidence: Math.round(clamp(best.holdout / Math.max(baseline, 0.001), 0, 3) * 100) / 100,
        validated: true,
      });
    }
    return { baseline, log, belief, sealed: true };
  }
}

/* --------------------------- multi-agent workflow ------------------------ */
function run_funding_arb_workflow(opts) {
  const o = { consult_beliefs: false, weekend: false, ...(opts || {}) };
  const steps = [];
  const step = (agent, action, detail) => steps.push({ agent, action, detail });

  const markets = (o.markets && o.markets.length ? o.markets : mockMarkets()).map(NormalizedMarket);
  step('MarketAgent', 'discover+normalize', markets.length + ' markets across ' +
    new Set(markets.map((m) => m.venue)).size + ' venues (mock feed, offline)');

  const detector = new FundingSpreadDetector(o.detector_cfg);
  if (o.consult_beliefs) {
    const store = o.belief_store || null;
    const validated = store ? store.validated() : [];
    const thr = validated.find((b) => b.param === 'min_gross_spread_apr');
    if (thr) {
      detector.cfg.min_gross_spread_apr = thr.value;
      step('BeliefAgent', 'consult (opt-in)', 'applied ' + thr.id + ': min_gross_spread_apr=' + thr.value);
    } else {
      step('BeliefAgent', 'consult (opt-in)', 'no validated beliefs available');
    }
  }
  const opps = detector.detect(markets);
  step('DetectorAgent', 'detect', opps.length + ' opportunity(ies) above ' +
    detector.cfg.min_gross_spread_apr.toFixed(2) + ' gross APR threshold');

  if (opps.length === 0) {
    step('Reporter', 'summary', 'no trade: nothing above threshold (fail closed)');
    return { steps, opportunities: [], decision: null, execution: null };
  }
  const guardian = o.guardian || new RiskGuardian(o.limits);
  const portfolio = o.portfolio || PortfolioState();
  const top = opps[0];
  const decision = guardian.evaluate(top, portfolio, { weekend: o.weekend });
  step('RiskGuardian', decision.approved ? 'approve' : 'reject',
    decision.approved
      ? 'notional=' + decision.approved.approved_notional + ' lev=' + decision.approved.approved_leverage.toFixed(1) +
        (decision.approved.weekend_buffer_applied ? ' (weekend buffer x' + guardian.limits.weekend_size_multiplier + ')' : '')
      : decision.reasons.join(', '));

  let execution = null;
  if (decision.approved) {
    const marks = {}; marks[top.long_venue] = top.long_mark; marks[top.short_venue] = top.short_mark;
    execution = new DryRunExecutor().execute(decision.approved, marks);
    portfolio.total_notional += decision.approved.approved_notional;
    portfolio.venue_notional[top.long_venue] = (portfolio.venue_notional[top.long_venue] || 0) + decision.approved.approved_notional;
    portfolio.venue_notional[top.short_venue] = (portfolio.venue_notional[top.short_venue] || 0) + decision.approved.approved_notional;
    step('ExecutionAgent', 'dry-run fill', execution.status + ' · 2 legs · ~$' +
      execution.est_daily_funding_usd + '/day est. funding capture');
  }
  step('Reporter', 'summary', decision.approved
    ? top.asset + ' long ' + top.long_venue + ' / short ' + top.short_venue + ' filled in dry-run'
    : 'no trade: guardian rejected (' + decision.reasons.join(', ') + ')');
  return { steps, opportunities: opps, decision, execution };
}

class EdgeOSClient {
  constructor(opts) {
    const o = opts || {};
    this.limits = o.limits || RiskLimits();
    this.guardian = o.guardian || new RiskGuardian(this.limits);
    this.detector = o.detector || new FundingSpreadDetector();
    this.portfolio = o.portfolio || PortfolioState();
    this.belief_store = o.belief_store || new BeliefStore();
    this.research = new ResearchLoop(this.belief_store, new SealedEvaluator(42));
    this.executor = new DryRunExecutor();
  }
  health() {
    return { status: 'ok', name: 'edge-os', version: '0.1.0', mode: 'mock',
      surfaces: ['kernel', 'sdk', 'cli', 'mcp', 'workflows', 'research', 'skills'] };
  }
  detect_opportunities(markets) { return this.detector.detect(markets); }
  evaluate_risk(opp, ctx) { return this.guardian.evaluate(opp, this.portfolio, ctx).approved; }
  run_workflow(opts) {
    return run_funding_arb_workflow({
      guardian: this.guardian, portfolio: this.portfolio,
      belief_store: this.belief_store, ...(opts || {}),
    });
  }
  run_research(iterations) { return this.research.run(iterations); }
}

/* ------------------------------- MCP server ------------------------------ */
/* Simulated MCP surface: tools/list + tools/call with JSON-RPC 2.0 shapes.
   Includes the edge_research_* tools required by AGENTS.md. */
function createMcpServer(client) {
  const c = client || new EdgeOSClient();
  const text = (obj) => ({ content: [{ type: 'text', text: JSON.stringify(obj, null, 2) }] });
  const tools = [
    { name: 'edge_status', description: 'Kernel health, version and active surfaces.',
      inputSchema: { type: 'object', properties: {} },
      run: () => text(c.health()) },
    { name: 'edge_scan', description: 'Run the offline mock funding scan and return opportunities.',
      inputSchema: { type: 'object', properties: { extended: { type: 'boolean' } } },
      run: (a) => text(c.detect_opportunities((a && a.extended) ? extendedMockMarkets() : mockMarkets())) },
    { name: 'edge_risk_check', description: 'Evaluate the reference XAU opportunity through RiskGuardian.',
      inputSchema: { type: 'object', properties: {} },
      run: () => { const r = c.guardian.evaluate(sampleOpportunity(), c.portfolio);
        return text(r.approved ? { approved: r.approved } : { rejected: r.reasons }); } },
    { name: 'edge_workflow_run', description: 'Run the multi-agent funding-arb workflow (mock, dry-run).',
      inputSchema: { type: 'object', properties: { consult_beliefs: { type: 'boolean' }, weekend: { type: 'boolean' } } },
      run: (a) => { const r = c.run_workflow(a || {});
        return text({ steps: r.steps, approved: !!(r.decision && r.decision.approved) }); } },
    { name: 'edge_research_run', description: 'Run the sealed research loop (fixed splits); writes validated beliefs.',
      inputSchema: { type: 'object', properties: { iterations: { type: 'number' } } },
      run: (a) => text(c.run_research(a && a.iterations)) },
    { name: 'edge_research_beliefs', description: 'List beliefs in the BeliefStore (sealed sandbox output).',
      inputSchema: { type: 'object', properties: {} },
      run: () => text({ sealed: c.belief_store.sealed, beliefs: c.belief_store.list() }) },
  ];
  return {
    client: c,
    list: () => ({ jsonrpc: '2.0', result: { tools: tools.map(({ name, description, inputSchema }) => ({ name, description, inputSchema })) } }),
    call: (name, args) => {
      const t = tools.find((x) => x.name === name);
      if (!t) return { jsonrpc: '2.0', error: { code: -32601, message: 'Unknown tool: ' + name } };
      try { return { jsonrpc: '2.0', result: t.run(args || {}) }; }
      catch (e) { return { jsonrpc: '2.0', error: { code: -32000, message: String(e && e.message || e) } }; }
    },
  };
}

/* ------------------------------ CLI emulator ------------------------------ */
/* Mirrors src/edge_os/cli.py: version / status / scan / risk-check, plus the
   operator surfaces the OS exposes. Live mode is refused (fail closed). */
function createCli(client, mcp) {
  const c = client || new EdgeOSClient();
  const m = mcp || createMcpServer(c);
  const pct = (x) => (x * 100).toFixed(1) + '%';
  const run = (line) => {
    const out = [];
    const argv = String(line || '').trim().split(/\s+/).filter(Boolean);
    const cmd = (argv[0] || '').toLowerCase();
    const has = (f) => argv.includes(f);
    switch (cmd) {
      case '': break;
      case 'help':
        out.push('edge-os — RWA Perps Agentic Operating System CLI',
          '  version           print kernel version',
          '  status            kernel health',
          '  scan [--live]     funding opportunity scan (mock by default)',
          '  risk-check        smoke-test RiskGuardian on the reference opp',
          '  workflow [--consult-beliefs] [--weekend]',
          '  research run [n]  sealed research loop (fixed splits)',
          '  beliefs           list BeliefStore contents',
          '  limits            show active RiskLimits',
          '  portfolio         show PortfolioState',
          '  kill on|off       engage / release the kill switch',
          '  mcp tools|call <name>',
          '  verify            run the verification suite',
          '  clear             clear the terminal');
        break;
      case 'version': out.push('Edge OS 0.1.0'); break;
      case 'status': out.push('OK ' + JSON.stringify(c.health())); break;
      case 'scan': {
        if (has('--live')) {
          out.push('ERROR live mode is disabled in this build (fail closed).',
            'Mock/offline is the verification path — AGENTS.md rules 3 & 5.');
          break;
        }
        const opps = c.detect_opportunities(has('--extended') ? extendedMockMarkets() : mockMarkets());
        if (!opps.length) { out.push('No opportunities above threshold.'); break; }
        out.push('Funding Opportunities');
        out.push('ASSET     LONG          SHORT         NET APR');
        for (const o of opps) {
          out.push((o.asset + '        ').slice(0, 10) + (o.long_venue + '            ').slice(0, 14) +
            (o.short_venue + '            ').slice(0, 14) + pct(o.estimated_net_apr) +
            (o.preferred_pairing ? '  *preferred pairing' : ''));
        }
        break;
      }
      case 'risk-check': {
        const approved = c.evaluate_risk(sampleOpportunity());
        out.push(approved
          ? 'Approved notional=' + approved.approved_notional.toFixed(0) + ' lev=' + approved.approved_leverage.toFixed(1)
          : 'Rejected');
        break;
      }
      case 'workflow': {
        const r = c.run_workflow({ consult_beliefs: has('--consult-beliefs'), weekend: has('--weekend') });
        for (const s of r.steps) out.push('[' + s.agent + '] ' + s.action + ' — ' + s.detail);
        break;
      }
      case 'research': {
        if ((argv[1] || '') !== 'run') { out.push('usage: research run [iterations]'); break; }
        const r = c.run_research(parseInt(argv[2], 10) || undefined);
        out.push('sealed evaluator baseline (holdout): ' + r.baseline);
        for (const l of r.log) out.push('  thr=' + l.candidate.toFixed(3) + '  train=' + l.train + '  holdout=' + l.holdout);
        out.push(r.belief ? 'validated belief written: ' + r.belief.id + ' — ' + r.belief.hypothesis
          : 'no belief beat the sealed baseline (nothing written)');
        break;
      }
      case 'beliefs': {
        const bs = c.belief_store.list();
        out.push(bs.length ? bs.map((b) => b.id + '  ' + (b.validated ? 'VALIDATED' : 'unvalidated') +
          '  ' + b.param + '=' + b.value + '  holdout=' + b.holdout_score).join('\n')
          : 'BeliefStore is empty. Run: research run');
        break;
      }
      case 'limits': out.push(JSON.stringify(c.limits, null, 2)); break;
      case 'portfolio': out.push(JSON.stringify({
        capital: c.portfolio.capital, total_notional: c.portfolio.total_notional,
        drawdown_pct: c.portfolio.drawdown_pct, kill_switch: c.portfolio.kill_switch,
        venue_notional: c.portfolio.venue_notional }, null, 2)); break;
      case 'kill':
        if (argv[1] === 'on') { c.portfolio.kill_switch = true; out.push('kill switch ENGAGED — guardian now rejects everything'); }
        else if (argv[1] === 'off') { c.portfolio.kill_switch = false; out.push('kill switch released'); }
        else out.push('usage: kill on|off');
        break;
      case 'mcp':
        if (argv[1] === 'tools') {
          for (const t of m.list().result.tools) out.push(t.name + ' — ' + t.description);
        } else if (argv[1] === 'call' && argv[2]) {
          const r = m.call(argv[2], {});
          out.push(JSON.stringify(r, null, 2));
        } else out.push('usage: mcp tools | mcp call <name>');
        break;
      default:
        out.push('unknown command: ' + cmd + '  (try: help)');
    }
    return out.join('\n');
  };
  return { run, client: c, mcp: m };
}

  });

  return checks;
}

function runVerifySuite(E) {
  const checks = buildVerifySuite(E);
  const results = checks.map((c) => {
    let pass = false, err = null;
    try { pass = c.fn() === true; } catch (e) { err = String(e && e.message || e); }
    return { group: c.group, name: c.name, pass, err };
  });
  const passed = results.filter((r) => r.pass).length;
  return { results, passed, failed: results.length - passed, total: results.length };
}

<li>Prefer small, focused changes. Update README.md and AGENTS.md when public surfaces change.</li>

{ id:'discovery', label:'DISCOVERY.md', provenance:'reconstructed', html:`
<h2>docs/DISCOVERY.md — market discovery pipeline</h2>
<p>Per the changelog, the Discovery doc aligns Edge OS to the SERVER OS six-stage process. The six stages as implemented by this kernel:</p>
<ol>
<li><b>Discover</b> — enumerate perp venues (Hyperliquid, Lighter, Binance, Ostium, Bybit, OKX) and their RWA + crypto listings. The default path uses the offline mock feed; live adapters are opt-in and out of scope for verification.</li>
<li><b>Normalize</b> — every listing becomes a <code>NormalizedMarket</code>: venue, symbol, base asset, asset class, mark price, funding rate + interval, annualized funding APR, open interest, max leverage, oracle freshness. Funding APR must equal <code>rate × (24/interval) × 365</code>.</li>
<li><b>Detect</b> — <code>FundingSpreadDetector</code> pairs venues per base asset: long the low-funding leg, short the high-funding leg. Gross spread = short APR − long APR; net subtracts a 10% slippage haircut and 2% fixed cost drag. Sub-5% gross spreads are noise and are dropped. Research-preferred pairings (Lighter + HL/Binance) rank first.</li>
<li><b>Guard</b> — <code>RiskGuardian</code> gates every opportunity (see SYNTHESIS).</li>
<li><b>Execute</b> — <code>DryRunExecutor</code> fills both legs at mark ± 5 bps simulated slippage. Live execution requires modes this build refuses by design.</li>
<li><b>Learn</b> — the sealed research loop scores hypotheses on fixed splits and writes validated beliefs; the live path never reads them without explicit opt-in.</li>
</ol>` },

{ id:'synthesis', label:'SYNTHESIS.md', provenance:'reconstructed', html:`
<h2>docs/SYNTHESIS.md — research-aligned risk synthesis</h2>
<p>The synthesis distilled 2026 RWA-perps market research into the hard limits the guardian enforces:</p>
<ul>
<li><b>Leverage 2–5x, hard.</b> Delta-neutral funding capture dies to liquidation risk above 5x and wastes capital below 2x. The caps are frozen constants; configuration cannot loosen them.</li>
<li><b>Preferred pairings.</b> Lighter paired with Hyperliquid or Binance showed the most persistent spreads with tolerable transfer friction; those pairs rank first.</li>
<li><b>Oracle gates.</b> RWA perps mark against off-chain oracles. A stale oracle on either leg is an automatic reject.</li>
<li><b>Weekend buffers.</b> Gold, FX and index underlyings close on weekends while perps keep trading — gap risk with no hedge exit. Weekend context halves approved size (and the detector flags weekend-exposed legs).</li>
<li><b>Dual-leg margin buffers.</b> Both legs post margin; the guardian requires 125% of naïve two-leg margin to fit in capital before approving.</li>
<li><b>Concentration caps.</b> ≤1% of the thinner leg's open interest, per-position / per-venue / total notional ceilings, −10% drawdown kill.</li>
<li><b>Fail closed.</b> Any gate failure rejects. There is no partial approval past a hard gate, and the kill switch rejects everything.</li>
</ul>` },

{ id:'skill-funding', label:'SKILL: funding-arb', provenance:'reconstructed', html:`
<h2>skills/funding-arb/SKILL.md</h2>
<p><b>When to use:</b> an operator asks to find, size, or dry-run a delta-neutral funding trade.</p>
<ol>
<li>Pull normalized markets (mock feed offline; adapters live).</li>
<li>Run <code>FundingSpreadDetector.detect()</code>; keep opportunities with positive net APR after the 10% slippage haircut + 2% cost drag.</li>
<li>Prefer Lighter + HL/Binance pairings; treat &gt;80% gross spreads as mean-reversion risk (risk score bumps).</li>
<li>Route the top opportunity through <code>RiskGuardian.evaluate()</code> with live portfolio state. Never bypass a rejection.</li>
<li>On approval, dry-run fill via <code>DryRunExecutor</code>; report notional, leverage, required margin and est. daily funding capture.</li>
<li>On weekends or stale oracles, expect halved size or rejection — that is the system working, not a bug.</li>
</ol>` },

{ id:'skill-aqua', label:'SKILL: aqua-research', provenance:'reconstructed', html:`
<h2>skills/aqua-research/SKILL.md</h2>
<p><b>When to use:</b> running or extending the research loop (AQuA-inspired, arXiv:2608.12841).</p>
<ol>
<li>Research runs only inside the sealed sandbox: fixed seeded data splits (train 160 / holdout 80 bars) and a frozen <code>SealedEvaluator</code>.</li>
<li>Hypotheses are scored on train, validated on holdout against the production baseline. Only holdout winners become <b>validated</b> beliefs.</li>
<li>Beliefs are frozen records in <code>BeliefStore</code> — evidence, not commands. Research code must never touch RiskLimits, PortfolioState, or executors.</li>
<li>The live workflow reads beliefs only when the operator passes <code>consult_beliefs=True</code>; the default path must show no BeliefAgent step.</li>
<li>Asymmetry is the point: capability flows out of the sandbox as validated evidence; authority never flows in.</li>
</ol>` },

  function renderTerm(el) {
    el.append(...header('python -m edge_os.cli', 'Terminal',

    const out = h('div', { id: 'termOut', role: 'log', 'aria-live': 'polite' });
    const line = (txt, cls) => {
      const d = h('div', { class: cls || '' }); d.textContent = txt; out.appendChild(d);
      out.scrollTop = out.scrollHeight;
    };
    line('Edge OS 0.1.0 \u2014 type "help" for commands.');
    const input = h('input', {
      id: 'termIn', type: 'text', autocomplete: 'off', autocapitalize: 'off',
      spellcheck: 'false', placeholder: 'edge-os \u203a', 'aria-label': 'terminal input',
      enterkeyhint: 'send',
    });
    input.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') exec();
      else if (ev.key === 'ArrowUp') { ev.preventDefault(); hist(1); }
      else if (ev.key === 'ArrowDown') { ev.preventDefault(); hist(-1); }
    });
    const chips = ['status', 'scan', 'scan --extended', 'risk-check', 'workflow --consult-beliefs',
      'research run 8', 'beliefs', 'limits', 'mcp tools', 'verify', 'kill on', 'kill off', 'help'];
    el.appendChild(out);
    el.appendChild(h('div', { class: 'termbar' }, input,
      h('button', { class: 'btn', onclick: exec, 'aria-label': 'run command' }, 'Run')));
    el.appendChild(h('div', { class: 'chips' }, chips.map((c) =>
      h('button', { onclick: () => { input.value = c; exec(); } }, c))));

    function hist(dir) {
      if (!OS.termHist.length) return;
      OS.termIdx = E.clamp(OS.termIdx + dir, -1, OS.termHist.length - 1);
      input.value = OS.termIdx === -1 ? '' : OS.termHist[OS.termHist.length - 1 - OS.termIdx];
    }
    function exec() {
      const cmd = input.value.trim(); if (!cmd) return;
      OS.termHist.push(cmd); OS.termIdx = -1;
      line('edge-os \u203a ' + cmd, 'in');
      if (cmd === 'clear') { out.innerHTML = ''; input.value = ''; return; }
      if (cmd === 'verify') {
        const r = globalThis.runVerifySuite(E);
        for (const g of ['kernel', 'models', 'detector', 'risk', 'exec', 'workflow', 'research', 'sdk', 'mcp', 'cli']) {
          const rs = r.results.filter((x) => x.group === g);
          line('  ' + g.padEnd(10) + rs.filter((x) => x.pass).length + '/' + rs.length + ' pass');
        }
        line(r.failed === 0 ? 'VERIFY OK \u2014 ' + r.passed + '/' + r.total + ' checks pass'
          : 'VERIFY FAILED \u2014 ' + r.failed + ' failing', r.failed === 0 ? '' : 'err');
      } else {
        const res = OS.cli.run(cmd);
        line(res, res.startsWith('ERROR') || res === 'Rejected' ? 'err' : '');
      }
      syncRail();
      input.value = '';
    }
  }

    for (const d of globalThis.EDGE_DOCS) tabs.appendChild(h('button', {
      class: d.id === OS.docTab ? 'act' : '',
      onclick: (ev) => { OS.docTab = d.id; [...tabs.children].forEach((b) => b.classList.remove('act')); ev.currentTarget.classList.add('act'); paint(); },
    }, d.label));
    el.appendChild(tabs); el.appendChild(body); paint();
    function paint() {
      const d = globalThis.EDGE_DOCS.find((x) => x.id === OS.docTab);
      body.innerHTML = '';
      body.appendChild(h('div', { class: 'prov' + (d.provenance === 'reconstructed' ? ' re' : '') },
        d.provenance === 'verbatim'
          ? '\u2713 VERBATIM \u2014 retrieved 1:1 from ANAMIZED/edge-os (Apache-2.0)'
          : '\u26A0 RECONSTRUCTED \u2014 written to the repo\u2019s stated contract; original file not retrievable by automated access'));
      body.appendChild(h('div', { class: 'card' }, h('div', { class: 'doc', html: d.html })));
    }
  }

  /* --------------------------- app: verify ---------------------------- */
  function renderVerify(el) {
    el.append(...header('scripts/verify.sh contract', 'Verification',
      'The same 62-check suite that gated this build in Node.js, re-run live against the kernel on your device. Every AGENTS.md surface is covered.'));
    const btn = h('button', { class: 'btn', onclick: run }, 'Run verification');
    el.appendChild(h('div', { class: 'btnrow' }, btn));
    const sum = h('div', { id: 'vsummary' },
      h('span', { id: 'vbadge' }, '\u2014'),
      h('div', { class: 'meter' }, h('i', { id: 'vmeter' })),
      h('span', { class: 'tag', id: 'vcount' }, '0 / 62'));
    el.appendChild(h('div', { class: 'card' }, sum, h('div', { id: 'vout' })));
    if (OS.verify.results) paintAll(OS.verify.results);

    function run() {
      if (OS.verify.running) return;
      OS.verify.running = true; btn.setAttribute('disabled', '');
      const checks = globalThis.buildVerifySuite(E);
      const results = [];
      const vout = $('#vout'); vout.innerHTML = '';
      let i = 0;
      const groups = {};
      (function step() {
        const slice = checks.slice(i, i + 4);
        for (const c of slice) {
          let pass = false, err = null;
          try { pass = c.fn() === true; } catch (e) { err = String(e && e.message || e); }
          results.push({ group: c.group, name: c.name, pass, err });
          if (!groups[c.group]) {
            groups[c.group] = h('div', { class: 'vgroup' }, h('h4', {}, c.group));
            vout.appendChild(groups[c.group]);
          }
          groups[c.group].appendChild(h('div', { class: 'vrow ' + (pass ? 'pass' : 'fail') },
            h('span', { class: 'mark' }, pass ? '\u2713' : '\u2717'),
            h('span', { class: 'nm' }, c.name + (err ? ' \u2014 ' + err : ''))));
        }
        i += slice.length;
        const passed = results.filter((r) => r.pass).length;
        $('#vmeter').style.width = (i / checks.length * 100) + '%';
        $('#vcount').textContent = passed + ' / ' + checks.length;
        if (i < checks.length) setTimeout(step, reduced ? 0 : 60);
        else {
          const failed = results.length - passed;
          const badge = $('#vbadge');
          badge.textContent = failed === 0 ? 'PASS' : 'FAIL';
          badge.className = failed === 0 ? 'pass' : 'fail';
          OS.verify.results = results; OS.verify.running = false;
          btn.removeAttribute('disabled');
        }
      })();
    }
    function paintAll(results) {
      const vout = $('#vout');
      const groups = {};
      for (const r of results) {
        if (!groups[r.group]) { groups[r.group] = h('div', { class: 'vgroup' }, h('h4', {}, r.group)); vout.appendChild(groups[r.group]); }
        groups[r.group].appendChild(h('div', { class: 'vrow ' + (r.pass ? 'pass' : 'fail') },
          h('span', { class: 'mark' }, r.pass ? '\u2713' : '\u2717'), h('span', { class: 'nm' }, r.name)));
      }
      const passed = results.filter((r) => r.pass).length;
      $('#vmeter').style.width = '100%';
      $('#vcount').textContent = passed + ' / ' + results.length;
      const badge = $('#vbadge');
      badge.textContent = passed === results.length ? 'PASS' : 'FAIL';
      badge.className = passed === results.length ? 'pass' : 'fail';
    }
  }

  /* ---------------------------- live feed ----------------------------- */
  function tick() {
    for (const m of OS.feed) {
      const drift = (OS.rnd() - 0.5) * 0.06;
      const anchor = 0.85 * m.funding_apr + 0.15 * (m.funding_apr > 1 ? 1.2 : m.funding_apr);
      m._prev = m.funding_apr;
      m.funding_apr = Math.max(0.005, anchor + drift);
      m.funding_rate = m.funding_apr / ((24 / m.funding_interval_hours) * 365);
      m.mark_price = m.mark_price * (1 + (OS.rnd() - 0.5) * 0.0006);
    }
    const hl = OS.feed.find((m) => m.venue === 'hyperliquid' && m.base_asset === 'XAU');
    const lt = OS.feed.find((m) => m.venue === 'lighter' && m.base_asset === 'XAU');
    if (hl && lt) {
      OS.spreadHist.push(Math.max(0, hl.funding_apr - lt.funding_apr));
      if (OS.spreadHist.length > 90) OS.spreadHist.shift();
    }
    if (OS.app === 'home') {
      const tbl = $('#boardTbl');
      if (tbl) [...tbl.tBodies[0].rows].forEach((row, i) => {
        const m = OS.feed[i];
        const cells = row.cells;
        cells[3].textContent = m.mark_price >= 100 ? m.mark_price.toFixed(1) : m.mark_price.toFixed(4);
        const aprCell = cells[4];
        aprCell.textContent = pct(m.funding_apr, 2);
        aprCell.classList.remove('tick-up', 'tick-down'); void aprCell.offsetWidth;
        aprCell.classList.add(m.funding_apr >= m._prev ? 'tick-up' : 'tick-down');
      });
      if (OS._drawSpark) OS._drawSpark();
    }
  }

  /* ------------------------------- boot ------------------------------- */
  function boot() {
    buildShell(); syncRail(); go('home');
    const bootEl = $('#boot');
    const lines = [
      ['EDGE OS', 'brand'],
      ['kernel v0.1.0 \u00b7 mock \u00b7 offline', ''],
      ['models ................ <span class="ok">OK</span>', ''],
      ['FundingSpreadDetector . <span class="ok">OK</span>', ''],
      ['RiskGuardian .......... <span class="ok">ARMED \u00b7 fail closed</span>', ''],
      ['leverage governor ..... <span class="warn">2x\u20135x HARD</span>', ''],
      ['BeliefStore ........... <span class="ok">SEALED</span>', ''],
      ['MCP \u00b7 SDK \u00b7 CLI ....... <span class="ok">6 tools \u00b7 ready</span>', ''],
      ['external network ...... <span class="ok">NONE (by design)</span>', ''],
    ];
    const post = $('#boot .post');
    if (reduced) { bootEl.classList.add('done'); startTicker(); return; }
    let i = 0;
    (function type() {
      if (i < lines.length) {
        const [txt, cls] = lines[i++];
        post.appendChild(h('div', { class: cls, html: txt }));
        setTimeout(type, i === 1 ? 420 : 190);
      } else setTimeout(() => { bootEl.classList.add('done'); startTicker(); }, 520);
    })();
    bootEl.addEventListener('click', () => { bootEl.classList.add('done'); startTicker(); }, { once: true });
  }
  let tickerOn = false;
  function startTicker() {
    if (tickerOn) return; tickerOn = true;
    tick(); setInterval(tick, 2600);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
